<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script>
      function toggleTheme() {
        document.documentElement.classList.toggle("dark");
      }
    </script>
  </head>
  <body
    class="bg-gradient-to-b from-indigo-900 via-blue-900 to-black text-white dark:text-white dark:bg-gradient-to-b dark:from-indigo-900 dark:via-blue-900 dark:to-black min-h-screen flex flex-col"
  >
    <!-- Header -->
    <header class="flex justify-between items-center p-6 bg-black/40">
      <a href="index.html" class="text-2xl font-bold">Delight</a>
      <nav class="space-x-4">
        <a href="index.html" class="hover:text-blue-400"
          ><i class="fa fa-home"></i> Home</a
        >
        <a href="project.html" class="hover:text-blue-400"
          ><i class="fa fa-folder"></i> Projects</a
        >
        <a href="contact.html" class="hover:text-blue-400"
          ><i class="fa fa-envelope"></i> Contact</a
        >
      </nav>
      <button
        onclick="toggleTheme()"
        class="px-3 py-1 bg-blue-600 rounded hover:bg-blue-500"
      >
        Toggle Mode
      </button>
    </header>

    <!-- Contact Section -->
    <main class="flex-grow p-10">
      <h1 class="text-4xl font-bold text-center mb-8">Get in Touch</h1>

      <div
        class="max-w-3xl mx-auto bg-white/10 dark:bg-black/30 p-8 rounded-lg shadow-lg"
      >
        <form class="space-y-4">
          <div>
            <label class="block mb-1 font-semibold">Name</label>
            <input
              type="text"
              required
              class="w-full px-3 py-2 rounded border focus:ring-2 focus:ring-blue-500 text-black"
            />
          </div>
          <div>
            <label class="block mb-1 font-semibold">Email</label>
            <input
              type="email"
              required
              class="w-full px-3 py-2 rounded border focus:ring-2 focus:ring-blue-500 text-black"
            />
          </div>
          <div>
            <label class="block mb-1 font-semibold">Message</label>
            <textarea
              required
              class="w-full px-3 py-2 rounded border focus:ring-2 focus:ring-blue-500 text-black"
            ></textarea>
          </div>
          <div class="flex space-x-4">
            <button
              type="submit"
              class="px-4 py-2 bg-blue-600 rounded hover:bg-blue-500 transition"
            >
              Submit
            </button>
            <button
              type="reset"
              class="px-4 py-2 bg-gray-600 rounded hover:bg-gray-500 transition"
            >
              Reset
            </button>
          </div>
        </form>
      </div>

      <!-- Extra Info -->
      <section class="mt-16 text-center">
        <h2 class="text-3xl font-bold mb-4">Find Me</h2>
        <p>
          Email:
          <a href="mailto:delight@example.com" class="text-blue-400"
            >delight@example.com</a
          >
        </p>
        <div class="flex justify-center space-x-6 mt-4">
          <a
            href="https://github.com"
            target="_blank"
            class="hover:text-blue-400"
            ><i class="fab fa-github fa-2x"></i
          ></a>
          <a
            href="https://linkedin.com"
            target="_blank"
            class="hover:text-blue-400"
            ><i class="fab fa-linkedin fa-2x"></i
          ></a>
          <a
            href="https://twitter.com"
            target="_blank"
            class="hover:text-blue-400"
            ><i class="fab fa-twitter fa-2x"></i
          ></a>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="p-4 text-center bg-black/40">
      © 2025 My Portfolio. Built with Tailwind.
    </footer>
  </body>
</html>
